AWSTemplateFormatVersion: '2010-09-09'
Description: Infraestructura pnkSecurity - RDS MariaDB, ALB y Auto Scaling Group

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
    Default: 172.31.0.0/16
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
  DBRootPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trafico HTTP/HTTPS hacia ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trafico HTTP desde ALB y SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MariaDB 3306 interno en VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref VpcCidr

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets para RDS pnkSecurity
      SubnetIds: !Ref SubnetIds

  PnkMariaDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: pnksecurity-mariadb
      DBName: pnksecurity
      Engine: mariadb
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: admin_pnk
      MasterUserPassword: !Ref DBRootPassword
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 0

  PnkALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: pnksecurity-alb
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing
      Type: application

  PnkTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: pnksecurity-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /
      Matcher:
        HttpCode: 200,302

  PnkListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PnkALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PnkTargetGroup

  PnkLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: pnksecurity-lt
      LaunchTemplateData:
        ImageId: !Ref UbuntuAmiId
        InstanceType: t3.micro
        KeyName: !Ref KeyName
        SecurityGroupIds:
          - !Ref WebSecurityGroup

  PnkAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: pnksecurity-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref PnkLaunchTemplate
        Version: !GetAtt PnkLaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      VPCZoneIdentifier: !Ref SubnetIds
      TargetGroupARNs:
        - !Ref PnkTargetGroup

Outputs:
  LoadBalancerDNS:
    Description: DNS del Load Balancer para Cloudflare
    Value: !GetAtt PnkALB.DNSName
  RDSEndpoint:
    Description: Host de RDS MariaDB
    Value: !GetAtt PnkMariaDB.Endpoint.Address
